version: 1
description: >-
  Every Beam action the agent can take. Playbooks name these ids; this file is
  the one place that says how each action runs (MCP first, then the CLI
  fallback), how risky it is, whether it needs the user's OK, what to re-read
  afterwards, and any practical notes. A command marked planned must be
  implemented before that action is considered complete in Beam Run.
defaults:
  surfaceOrder: [mcp, cli]
  workspaceRequired: true
  confirmation: none
  retry: reconcile-before-retry

operations:
  user.current:
    execution: {"inputSchema":{"type":"object","properties":{},"required":[],"additionalProperties":false},"commands":[[{"literal":"whoami"}]]}
    safety: read
    mcp: getCurrentUser
    cli: beam whoami
    status: ready
    notes: "Gives the user id that Learning Hub writes need. Never invent a user id."
  docs.search:
    execution: {"inputSchema":{"type":"object","properties":{"query":{"type":"string","maxLength":200000},"url":{"type":"string","maxLength":200000}},"required":["query"],"additionalProperties":false},"commands":[[{"literal":"docs"},{"field":"query","kind":"value"},{"field":"url","kind":"value","optional":true,"flag":"--page"}]]}
    safety: read
    workspaceRequired: false
    mcp: null
    cli: beam docs <query> [--page url]
    status: ready
    notes: "Check the live product docs before relying on how a feature works (loops, automation modes, publishing, triggers, evaluation); the live docs outrank any vendored note."
  workspace.create:
    execution: {"inputSchema":{"type":"object","properties":{"name":{"type":"string","maxLength":200000},"domain":{"type":"string","maxLength":200000},"url":{"type":"string","maxLength":200000}},"required":["name"],"additionalProperties":false},"commands":[[{"literal":"workspace"},{"literal":"create"},{"field":"name","kind":"value"},{"field":"domain","kind":"value","optional":true,"flag":"--domain"},{"field":"url","kind":"value","optional":true,"flag":"--icon-src"}]]}
    safety: external-effect
    workspaceRequired: false
    confirmation: explicit-workspace-create-intent
    mcp: null
    cli: beam workspace create <name> [--domain domain] [--icon-src url]
    postRead: user.current
    status: ready
    notes: "Creating a workspace does not switch to it."
  agent.list:
    execution: {"inputSchema":{"type":"object","properties":{},"required":[],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"list"}]]}
    safety: read
    mcp: listAgents
    cli: beam agents list
    status: ready
    notes: "When more than one agent matches a name, ask which one; never pick by display name alone."
  agent.get:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"get"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agents get <agentId>
    status: ready
    notes: "Shows activeGraphId (live) and draftGraphId (unpublished). Report the model token exactly as returned. createdAt is the default start date for analytics."
  agent.delete:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"delete"},{"field":"agentId","kind":"value"},{"literal":"--confirm"},{"field":"agentId","kind":"value"}]]}
    safety: destructive-write
    confirmation: explicit-agent-name-and-id
    mcp: null
    cli: beam agents delete <agentId> --confirm <agentId>
    preRead: agent.get
    postRead: agent.list
    status: ready
    notes: "Irreversible. Confirm with the agent's exact name and id."
  agent.tools:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"tools"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: beam_get_agent_tools
    cli: beam agents tools <agentId>
    status: ready
    notes: "Report toolName, description and requiresConsent per tool. Each tool's toolFunctionName is the key for integration.is-connected."
  agent.sub-agents:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"sub-agents"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: beam_list_sub_agents
    cli: beam agents sub-agents <agentId>
    status: ready
  agent.files:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"files"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: beam_list_context_files
    cli: beam agents files <agentId>
    status: ready
    notes: "The result is a list whose first entry holds the files."
  agent.history:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"history"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: beam_get_graph_history
    cli: beam agents history <agentId>
    status: ready
  agent.update-metadata:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"name":{"type":"string","maxLength":200000},"description":{"type":"string","maxLength":200000},"personality":{"type":"string","maxLength":200000},"restrictions":{"type":"string","maxLength":200000},"promptsFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-metadata"},{"field":"agentId","kind":"value"},{"field":"name","kind":"value","optional":true,"flag":"--name"},{"field":"description","kind":"value","optional":true,"flag":"--description"},{"field":"personality","kind":"value","optional":true,"flag":"--personality"},{"field":"restrictions","kind":"value","optional":true,"flag":"--restrictions"},{"field":"promptsFile","kind":"json-file","optional":true,"flag":"--prompts-file"}]]}
    safety: reversible-write
    mcp: agent_update_metadata
    cli: beam agent-builder update-metadata <agentId> ...
    postRead: agent.get
    status: ready
    notes: "Changes name, description, suggested prompts, personality and restrictions. The model of a step changes with graph.update-node; the agent's icon and category cannot be changed from here, so say so and link beam://agent.config?agentId=<id>."
  agent.remove-tools:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"payloadFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","payloadFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"remove-tools"},{"field":"agentId","kind":"value"},{"field":"payloadFile","kind":"json-file"},{"literal":"--confirm"},{"field":"agentId","kind":"value"}]]}
    safety: destructive-write
    confirmation: explicit
    mcp: agent_remove_tools
    cli: beam agents remove-tools <agentId> <payloadFile> --confirm <agentId>
    postRead: agent.tools
    status: ready
    notes: "Show the exact list first; removing more than five always needs a second look."
  agent.external-files-add:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"payloadFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","payloadFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"external-files-add"},{"field":"agentId","kind":"value"},{"field":"payloadFile","kind":"json-file"}]]}
    safety: reversible-write
    mcp: agent_upload_external_file
    cli: beam agents external-files-add <agentId> <payloadFile>
    postRead: agent.files
    status: ready
  agent.upload-file:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"localFile":{"type":"string","minLength":1,"description":"Prism artifact id; never a filesystem path"}},"required":["agentId","localFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"upload-file"},{"field":"agentId","kind":"value"},{"field":"localFile","kind":"artifact"}]]}
    safety: reversible-write
    mcp: agent_upload_context_file
    cli: beam agents upload-file <agentId> <localFile>
    postRead: agent.files
    status: ready
  agent.context-file-delete:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"fileKey":{"type":"string","maxLength":200000}},"required":["agentId","fileKey"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"context-file-delete"},{"field":"agentId","kind":"value"},{"field":"fileKey","kind":"value"},{"literal":"--confirm"},{"field":"fileKey","kind":"value"}]]}
    safety: destructive-write
    confirmation: always
    mcp: agent_delete_context_file
    cli: beam agents context-file-delete <agentId> <fileKey> --confirm <fileKey>
    postRead: agent.files
    status: ready
  agent.external-files-delete:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"payloadFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","payloadFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"external-files-delete"},{"field":"agentId","kind":"value"},{"field":"payloadFile","kind":"json-file"},{"literal":"--confirm"},{"field":"agentId","kind":"value"}]]}
    safety: destructive-write
    confirmation: always
    mcp: agent_delete_external_file
    cli: beam agents external-files-delete <agentId> <payloadFile> --confirm <agentId>
    postRead: agent.files
    status: ready
  agent.change-file-agent:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"payloadFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","payloadFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"change-file-agent"},{"field":"agentId","kind":"value"},{"field":"payloadFile","kind":"json-file"}]]}
    safety: reversible-write
    mcp: agent_change_file_agent
    cli: beam agents change-file-agent <agentId> <payloadFile>
    status: ready
  agent.transcribe:
    execution: {"inputSchema":{"type":"object","properties":{"localAudioFile":{"type":"string","minLength":1,"description":"Prism artifact id; never a filesystem path"}},"required":["localAudioFile"],"additionalProperties":false},"commands":[[{"literal":"agents"},{"literal":"transcribe"},{"field":"localAudioFile","kind":"artifact"}]]}
    safety: read
    mcp: agent_transcribe_audio
    cli: beam agents transcribe <localAudioFile>
    status: ready

  graph.get:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"get-graph"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder get-graph <agentId>
    status: ready
    notes: "Large (around 136 KB). Prefer graph.nodes for structure; fetch the full graph only for a node id or when the user asks for the whole thing."
  graph.nodes:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"get-nodes"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder get-nodes <agentId>
    status: ready
    notes: "Light list of node id and objective. The entry node has the objective 'Entry Node'."
  graph.node:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000}},"required":["agentId","nodeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"get-node"},{"field":"agentId","kind":"value"},{"field":"nodeId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder get-node <agentId> <nodeId>
    status: ready
  graph.verify-links:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"verify-links"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder verify-links <agentId>
    status: ready
    notes: "Report any broken link by node. Changes are checked with graph.readiness, which includes links."
  graph.readiness:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"readiness"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder readiness <agentId>
    status: ready
    notes: "Every graph change returns this report. Resolve every failure before testing or publishing."
  model.catalog:
    execution: {"inputSchema":{"type":"object","properties":{},"required":[],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"models"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder models
    status: ready
    notes: "The only valid list of models for this workspace, including the default. Check it before setting or discussing a step's model or its cost."
  graph.deploy:
    execution: {"inputSchema":{"type":"object","properties":{"specFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["specFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"deploy"},{"field":"specFile","kind":"json-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder deploy <specFile>
    postRead: graph.readiness
    status: ready
    notes: "Lint and run with --dry-run --summary first. With --agent-id it rewrites the whole graph: include every node to keep; node ids change and an existing trigger is deleted. Stays a draft unless --publish is passed, which needs graph.publish's confirmation. Returns a readiness report; resolve every failure before testing or publishing."
  graph.publish:
    execution: {"inputSchema":{"type":"object","properties":{"graphId":{"type":"string","maxLength":200000},"agentId":{"type":"string","maxLength":200000}},"required":["graphId","agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"publish"},{"field":"graphId","kind":"value"},{"literal":"--agent-id"},{"field":"agentId","kind":"value"}]]}
    safety: external-effect
    confirmation: explicit-publish-intent
    mcp: null
    cli: beam agent-builder publish <graphId> --agent-id <agentId>
    postRead: graph.get
    status: ready
    notes: "Makes the draft live. After graph.readiness passes, show the exact draft and live effect and wait for confirmation, even if the initial request explicitly asked to publish. A yes to that concrete proposal authorizes this publication only; a no leaves the draft unpublished."
  graph.update-prompt:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000},"promptFile":{"type":"string","maxLength":200000}},"required":["agentId","nodeId","promptFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-node-prompt"},{"field":"agentId","kind":"value"},{"field":"nodeId","kind":"value"},{"field":"promptFile","kind":"text-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder update-node-prompt <agentId> <nodeId> <promptFile>
    postRead: graph.readiness
    status: ready
    notes: "Smallest change for prompt or tone edits."
  graph.update-params:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000},"inputParamsFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"},"outputParamsFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","nodeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-node-params"},{"field":"agentId","kind":"value"},{"field":"nodeId","kind":"value"},{"field":"inputParamsFile","kind":"json-file","optional":true,"flag":"--input-params-file"},{"field":"outputParamsFile","kind":"json-file","optional":true,"flag":"--output-params-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder update-node-params <agentId> <nodeId> ...
    postRead: graph.readiness
    status: ready
  graph.update-consent:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000},"enabled":{"type":"string","maxLength":200000,"enum":["true","false"]}},"required":["agentId","nodeId","enabled"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-node-consent"},{"field":"agentId","kind":"value"},{"field":"nodeId","kind":"value"},{"field":"enabled","kind":"value"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder update-node-consent <agentId> <nodeId> <true|false>
    postRead: graph.readiness
    status: ready
    notes: "A setting on an existing integration step, not a new step: the run asks for consent right before that tool runs."
  graph.add-node:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"},"sourceNodeId":{"type":"string","maxLength":200000},"targetNodeId":{"type":"string","maxLength":200000},"integrationFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","nodeFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"add-node"},{"field":"agentId","kind":"value"},{"field":"nodeFile","kind":"json-file"},{"field":"sourceNodeId","kind":"value","optional":true,"flag":"--source-node-id"},{"field":"targetNodeId","kind":"value","optional":true,"flag":"--target-node-id"},{"field":"integrationFile","kind":"json-file","optional":true,"flag":"--integration-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder add-node <agentId> <nodeFile> ...
    postRead: graph.readiness
    status: ready
    notes: "Rewrites the graph: node ids change and an existing trigger is deleted. Re-read nodes afterwards and re-create the trigger."
  graph.remove-node:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000}},"required":["agentId","nodeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"remove-node"},{"field":"agentId","kind":"value"},{"field":"nodeId","kind":"value"}]]}
    safety: destructive-write
    confirmation: explicit
    mcp: null
    cli: beam agent-builder remove-node <agentId> <nodeId>
    postRead: graph.readiness
    status: ready
    notes: "Rewrites the graph: node ids change and an existing trigger is deleted. Re-read nodes afterwards."
  graph.test-node:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"graphId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000},"paramsJson":{"type":["object","array"]}},"required":["agentId","graphId","nodeId","paramsJson"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"test-node"},{"field":"agentId","kind":"value"},{"field":"graphId","kind":"value"},{"field":"nodeId","kind":"value"},{"field":"paramsJson","kind":"json"}]]}
    safety: reversible-write
    mcp: testGraphNode
    cli: beam agent-builder test-node <agentId> <graphId> <nodeId> <paramsJson>
    status: ready
    notes: "Runs one step with explicit inputs; needs agentId, graphId, nodeId and a JSON params object."
  graph.triggers:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"entryNodeId":{"type":"string","maxLength":200000}},"required":["agentId","entryNodeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"get-triggers"},{"field":"agentId","kind":"value"},{"field":"entryNodeId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder get-triggers <agentId> <entryNodeId>
    status: ready
    notes: "Needs the entry node id from graph.nodes as well as the agent id."
  graph.trigger-readiness:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"entryNodeId":{"type":"string","maxLength":200000}},"required":["agentId","entryNodeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"validate-trigger"},{"field":"agentId","kind":"value"},{"field":"entryNodeId","kind":"value"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder validate-trigger <agentId> <entryNodeId>
    status: ready
    notes: "Run after every timer or integration trigger create or update; do not call a trigger working until it passes."
  graph.webhook:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000}},"required":["agentId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"get-webhook"},{"field":"agentId","kind":"value"}]]}
    safety: read
    mcp: getAgentGraph
    cli: beam agent-builder get-webhook <agentId>
    status: ready
  graph.validate:
    execution: {"inputSchema":{"type":"object","properties":{},"required":[],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"validate"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder validate
    status: ready
    notes: "Run before the first builder read or write. Exit 3 means sign in with beam login; exit 2 means a workspace is needed; exit 5 is a network problem (suggest beam doctor). Read the JSON next field on any failure."
  graph.search-tools:
    execution: {"inputSchema":{"type":"object","properties":{"keyword":{"type":"string","maxLength":200000},"managedOnly":{"type":"boolean"}},"required":["keyword"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"search-tools"},{"field":"keyword","kind":"value"},{"field":"managedOnly","flag":"--managed-only","kind":"boolean","optional":true}]]}
    safety: read
    mcp: null
    cli: beam agent-builder search-tools <keyword> [--managed-only]
    status: ready
    notes: "Search before adding any integration step; never invent a toolFunctionName. Prefer nango_cloud, then pipedream; ask before choosing a custom fallback."
  graph.search-agents:
    execution: {"inputSchema":{"type":"object","properties":{"keyword":{"type":"string","maxLength":200000}},"required":["keyword"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"search-agents"},{"field":"keyword","kind":"value"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder search-agents <keyword>
    status: ready
    notes: "Use before building, to avoid duplicating an existing agent."
  graph.attach-tool:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"graphId":{"type":"string","maxLength":200000},"nodeId":{"type":"string","maxLength":200000},"toolConfigFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","graphId","nodeId","toolConfigFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"attach-tool"},{"field":"agentId","kind":"value"},{"field":"graphId","kind":"value"},{"field":"nodeId","kind":"value"},{"field":"toolConfigFile","kind":"json-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder attach-tool <agentId> <graphId> <nodeId> <toolConfigFile>
    postRead: graph.readiness
    status: ready
  graph.update-node:
    execution: {"inputSchema":{"type":"object","properties":{"agentId":{"type":"string","maxLength":200000},"graphId":{"type":"string","maxLength":200000},"nodeFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["agentId","graphId","nodeFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-node"},{"field":"agentId","kind":"value"},{"field":"graphId","kind":"value"},{"field":"nodeFile","kind":"json-file"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder update-node <agentId> <graphId> <nodeFile>
    postRead: graph.readiness
    status: ready
    notes: "For a step's model or other configuration. Read the full node first and send it back whole."
  graph.update-edge:
    execution: {"inputSchema":{"type":"object","properties":{"edgeId":{"type":"string","maxLength":200000},"condition":{"type":"string","maxLength":200000}},"required":["edgeId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-edge"},{"field":"edgeId","kind":"value"},{"field":"condition","kind":"value","optional":true,"flag":"--condition"}]]}
    safety: reversible-write
    mcp: null
    cli: beam agent-builder update-edge <edgeId> [--condition TEXT]
    postRead: graph.readiness
    status: ready
  graph.trigger-actions:
    execution: {"inputSchema":{"type":"object","properties":{"integrationIdentifier":{"type":"string","maxLength":200000}},"required":["integrationIdentifier"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"trigger-actions"},{"field":"integrationIdentifier","kind":"value"}]]}
    safety: read
    mcp: null
    cli: beam agent-builder trigger-actions <integrationIdentifier>
    status: ready
    notes: "Actions differ per workspace; always look them up. Gives the integrationProviderId for an integration trigger; a timer needs none."
  graph.create-trigger:
    execution: {"inputSchema":{"type":"object","properties":{"triggerFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["triggerFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"create-trigger"},{"field":"triggerFile","kind":"json-file"}]]}
    safety: external-effect
    confirmation: explicit
    mcp: null
    cli: beam agent-builder create-trigger <triggerFile>
    postRead: graph.trigger-readiness
    status: ready
    notes: "Once active, the agent starts runs on its own. One trigger per agent: delete the old one first. Add it last, after the graph is settled, because a graph rewrite deletes it."
  graph.update-trigger:
    execution: {"inputSchema":{"type":"object","properties":{"triggerId":{"type":"string","maxLength":200000},"triggerFile":{"type":["object","array"],"description":"JSON payload staged by the host into a private file"}},"required":["triggerId","triggerFile"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"update-trigger"},{"field":"triggerId","kind":"value"},{"field":"triggerFile","kind":"json-file"}]]}
    safety: external-effect
    confirmation: explicit
    mcp: null
    cli: beam agent-builder update-trigger <triggerId> <triggerFile>
    postRead: graph.trigger-readiness
    status: ready
  graph.toggle-trigger:
    execution: {"inputSchema":{"type":"object","properties":{"triggerId":{"type":"string","maxLength":200000}},"required":["triggerId"],"additionalProperties":false},"commands":[[{"literal":"agent-builder"},{"literal":"toggle-trigger"},{"field":"triggerId","kind":"value"}]]}
    safety: external-effect
    confirmation: explicit
    mcp: null
    cli: beam agent-builder toggle-trigger <triggerId>
    postRead: graph.triggers
