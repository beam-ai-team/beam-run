    status: ready
  task.approve:
    specialist: inbox
    safety: external-effect
    confirmation: always
    mcp: approveTaskExecution
    cli: beam tasks approve <taskId> <taskNodeId> --confirm <taskNodeId>
    postRead: task.get
    status: ready
  task.reject:
    specialist: inbox
    safety: destructive-write
    confirmation: always
    mcp: rejectTaskExecution
    cli: beam tasks reject <taskId> <taskNodeId> --confirm <taskNodeId> [--reason <text>]
