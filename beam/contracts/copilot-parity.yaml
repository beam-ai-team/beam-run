version: 1
source:
  repository: beam-agent-os
  commit: 40fdd5687a7a4e9122c27d8b175235107c096a58
  root: src/mastra/agents/copilot
hostAdapters:
  - id: delegation
    change: Replace Mastra agent delegation tool calls with host-native skill loading.
  - id: page-context
    change: Replace BeamNext page metadata with the normalized Beam Run context contract.
  - id: navigation
    change: Preserve Beam deep links when useful; do not require in-product page navigation to finish work.
  - id: ask-user
    change: Use the host's user-question/confirmation interaction rather than Copilot's ask_user event.
  - id: transport
    change: Add MCP-first and typed CLI fallback behavior without changing product-domain instructions.
  - id: general-host-capabilities
    change: Leave generic web, file, code, and project work to the coding-agent host; retain Beam-specific workspace behavior.
  - id: compiled-runtime
    change: Compile pinned Copilot prompt excerpts and the operation registry into host-neutral runtime cards; runtime hosts never load raw source snapshots during normal user work.
  - id: universal-public-surface
    change: Expose one public Beam Run skill plus the existing setup skill on every host; preserve former specialist skills under internal/ for migration and audit only.
